<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Marswalk</title>
    <link rel="stylesheet" href="/src/game/game.css" />
  </head>
  <body>
    <div id="view"></div>

    <div id="hud"></div>
    <pre id="debug"></pre>

    <div id="stick"><div id="knob"></div></div>

    <div id="loading" class="overlay">Loading…</div>

    <div id="start" class="overlay" style="display: none">
      <div class="card">
        <h1>MARSWALK</h1>
        <p class="lead">Gale Crater, Mars. There is no GPS here, and a compass does not work.</p>
        <p id="startHelp" class="help"></p>
        <button id="startBtn">Begin EVA</button>
        <p class="credit">Terrain and imagery: NASA/JPL-Caltech/UArizona/USGS (MRO HiRISE)</p>
      </div>
    </div>

    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
