<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AresSight — EVA planning</title>
    <meta name="description" content="Plan a walk on Mars that always gets you home. Real NASA data of Gale Crater." />
    <meta name="theme-color" content="#000000" />
    <script>
      // pick the language before anything is drawn, so no text switches after the page appears
      try {
        var l = localStorage.getItem("marswalk-lang");
        document.documentElement.dataset.lang = l === "ja" || l === "en" ? l : navigator.language.toLowerCase().indexOf("ja") === 0 ? "ja" : "en";
      } catch (e) {
        document.documentElement.dataset.lang = "en";
      }
      // resolves when the page-change animation is over; heavy 3D work waits for it
      window.__revealed = new Promise(function (done) {
        addEventListener("pagereveal", function (e) {
          window.__vt = !!e.viewTransition;
          if (e.viewTransition) e.viewTransition.finished.then(done, done);
          else done();
        }, { once: true });
        setTimeout(done, 700);
      });
    </script>
    <link rel="stylesheet" href="/src/site/site.css" />
    <link rel="stylesheet" href="/src/site/home.css" />
  </head>
  <body class="home">
    <div class="halo" aria-hidden="true"></div>
    <div id="globe" aria-hidden="true"></div>
    <div class="spot" id="spot" aria-hidden="true"><span data-l="en">Gale Crater</span><span data-l="ja">ゲール・クレーター</span></div>

    <header class="bar">
      <a class="logo" href="/">AresSight</a>
      <nav class="links" aria-label="Pages">
        <a href="/intro.html"><span data-l="en">Introduction</span><span data-l="ja">初めに</span></a>
        <a href="/how.html"><span data-l="en">How it works</span><span data-l="ja">仕組み</span></a>
        <a href="/credits.html"><span data-l="en">Credits</span><span data-l="ja">クレジット</span></a>
        <div class="dd" id="dd">
          <button class="dd-btn" id="ddBtn" aria-expanded="false" aria-controls="below">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" /></svg>
            <span id="ddLabel"></span>
            <span class="dd-count" id="ddCount"></span>
            <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
          <section class="below" id="below" hidden></section>
        </div>
        <button class="lang" data-toggle-lang aria-label="Language"><span data-l="en">日本語</span><span data-l="ja">EN</span></button>
      </nav>
    </header>

    <h1 class="title"><span class="w1">Ares</span><span class="w2">Sight</span></h1>


    <main class="start">
      <div class="search" id="search">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8" /><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" aria-label="Search places in Gale Crater" aria-controls="suggest" />
        <script>
          document.getElementById("q").placeholder = document.documentElement.dataset.lang === "ja" ? "ゲール・クレーターの場所を検索" : "Search a place in Gale Crater";
        </script>
        <a class="new" href="/sim.html" aria-label="New plan">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" /></svg>
          <span data-l="en">New plan</span><span data-l="ja">新しい計画</span>
        </a>
        <ul class="suggest" id="suggest" hidden></ul>
      </div>
    </main>

    <footer class="foot">
      <span>Mars: NASA Viking colour mosaic (USGS) · Gale Crater: MRO HiRISE</span>
    </footer>

    <script type="module" src="/src/site/home.ts"></script>
  </body>
</html>
