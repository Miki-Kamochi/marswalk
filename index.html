<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Marswalk</title>
    <meta name="description" content="Plan a walk on Mars that never gets you lost. Real NASA data of Gale Crater." />
    <meta name="theme-color" content="#0b0908" />
    <link rel="stylesheet" href="/src/site/site.css" />
    <link rel="stylesheet" href="/src/site/home.css" />
  </head>
  <body class="home">
    <div id="bg" aria-hidden="true"></div>
    <div class="scrim" aria-hidden="true"></div>

    <header class="top">
      <span class="small">NASA SPACE APPS 2026</span>
      <div class="langs" role="group" aria-label="Language">
        <button data-set-lang="en">EN</button>
        <button data-set-lang="ja">日本語</button>
      </div>
    </header>

    <main class="menu">
      <h1 class="logo">MARSWALK</h1>
      <p class="tagline">
        <span data-l="en">No GPS. Limited oxygen. Plan the walk that brings you home.</span>
        <span data-l="ja">GPSはない。酸素には限りがある。必ず帰れる道を計画せよ。</span>
      </p>

      <nav aria-label="Menu">
        <ul class="items" id="items">
          <li>
            <a href="/sim.html" data-shot="planner">
              <span class="cursor" aria-hidden="true">▶</span>
              <span data-l="en">Route planner</span><span data-l="ja">ルート・プランナー</span>
            </a>
          </li>
          <li>
            <a href="/game.html" data-shot="game">
              <span class="cursor" aria-hidden="true">▶</span>
              <span data-l="en">Expedition</span><span data-l="ja">探査ゲーム</span>
            </a>
          </li>
          <li>
            <a href="/how.html" data-shot="how">
              <span class="cursor" aria-hidden="true">▶</span>
              <span data-l="en">How it works</span><span data-l="ja">仕組み</span>
            </a>
          </li>
          <li>
            <a href="/credits.html" data-shot="credits">
              <span class="cursor" aria-hidden="true">▶</span>
              <span data-l="en">Credits</span><span data-l="ja">クレジット</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="box" id="desc" aria-live="polite"></div>
    </main>

    <footer class="bottom">
      <p class="keys">
        <span><span data-l="en">↑↓ select</span><span data-l="ja">↑↓ 選ぶ</span></span>
        <span><span data-l="en">Enter open</span><span data-l="ja">Enter 決定</span></span>
      </p>
      <p class="readout" id="readout">
        <span data-l="en">loading terrain…</span><span data-l="ja">地形を読み込み中…</span>
      </p>
    </footer>

    <script type="module" src="/src/site/home.ts"></script>
  </body>
</html>
