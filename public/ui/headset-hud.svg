<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="none">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff"/><stop offset=".22" stop-color="#d8dde2"/><stop offset=".5" stop-color="#f7f8f8"/><stop offset=".78" stop-color="#aeb7c0"/><stop offset="1" stop-color="#f6f7f8"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#17212a" stop-opacity=".9"/><stop offset=".15" stop-color="#71808c" stop-opacity=".28"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset=".85" stop-color="#71808c" stop-opacity=".28"/><stop offset="1" stop-color="#17212a" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#70eaff" stop-opacity="0"/><stop offset=".5" stop-color="#89f3ff" stop-opacity=".72"/><stop offset="1" stop-color="#70eaff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence baseFrequency=".7" numOctaves="2" seed="7" type="fractalNoise" result="n"/>
      <feComposite in="n" in2="SourceGraphic" operator="in" result="t"/>
      <feBlend in="SourceGraphic" in2="t" mode="multiply"/>
    </filter>
  </defs>
  <g pointer-events="none">
    <!-- Soft visor bloom and dark gasket establish the glass edge without covering the view. -->
    <ellipse cx="800" cy="462" rx="775" ry="505" fill="none" stroke="#eaf7ff" stroke-opacity=".24" stroke-width="34" filter="url(#soft)"/>
    <ellipse cx="800" cy="462" rx="762" ry="493" fill="none" stroke="#101922" stroke-opacity=".7" stroke-width="34"/>
    <!-- White composite helmet shell, thick at the temples and lower jaw like the reference. -->
    <path d="M0 0H140L112 76C74 184 60 305 75 425C89 544 135 653 190 744L237 820L111 900H0Z" fill="url(#shell)" filter="url(#grain)"/>
    <path d="M1600 0H1460L1488 76C1526 184 1540 305 1525 425C1511 544 1465 653 1410 744L1363 820L1489 900H1600Z" fill="url(#shell)" filter="url(#grain)"/>
    <path d="M0 900V830L188 754C317 824 511 856 800 858C1089 856 1283 824 1412 754L1600 830V900Z" fill="url(#shell)" filter="url(#grain)"/>
    <path d="M0 0H1600V43L1390 80C1200 45 1000 32 800 34C600 32 400 45 210 80L0 43Z" fill="url(#shell)" filter="url(#grain)"/>
    <!-- Recessed gasket and seams. -->
    <path d="M137 0C112 124 95 251 106 386C120 553 181 685 270 790M1463 0C1488 124 1505 251 1494 386C1480 553 1419 685 1330 790" fill="none" stroke="url(#shadow)" stroke-width="23"/>
    <path d="M181 756C335 835 527 866 800 867C1073 866 1265 835 1419 756" fill="none" stroke="#313e48" stroke-opacity=".72" stroke-width="24"/>
    <path d="M230 69Q800 -12 1370 69" fill="none" stroke="#45535e" stroke-opacity=".7" stroke-width="17"/>
    <!-- Small panel joints and fasteners add a practical composite-shell texture. -->
    <g fill="none" stroke="#7a8790" stroke-opacity=".6" stroke-width="3">
      <path d="M25 178L119 199M18 626L147 590M1575 178L1481 199M1582 626L1453 590"/>
      <path d="M132 840L235 803M1468 840L1365 803M530 872L518 900M1070 872L1082 900"/>
    </g>
    <g fill="#596873" stroke="#f7f9fa" stroke-width="3">
      <circle cx="86" cy="233" r="8"/><circle cx="91" cy="674" r="8"/><circle cx="1514" cy="233" r="8"/><circle cx="1509" cy="674" r="8"/>
      <circle cx="302" cy="851" r="7"/><circle cx="1298" cy="851" r="7"/>
    </g>
    <!-- The projected electronics remain subtle blue inside the white physical rim. -->
    <path d="M340 80H1260" stroke="url(#blue)" stroke-width="3"/>
    <path d="M675 69H925M792 64H808M800 54V75" fill="none" stroke="#a4f7ff" stroke-opacity=".8" stroke-width="2"/>
    <path d="M145 250V155H225M145 650V740H225M1455 250V155H1375M1455 650V740H1375" fill="none" stroke="#8befff" stroke-opacity=".35" stroke-width="2"/>
    <path d="M776 450H792M808 450H824M800 426V442M800 458V474" stroke="#9df6ff" stroke-opacity=".28" stroke-width="2"/>
    <circle cx="800" cy="450" r="8" fill="none" stroke="#9df6ff" stroke-opacity=".25"/>
  </g>
</svg>
